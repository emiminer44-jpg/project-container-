name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ''

      - name: Reemplazar eas.json
        run: |
          cat > eas.json << 'EOF'
          {
            "cli": { "version": ">= 10.0.0" },
            "build": {
              "preview": {
                "android": { "buildType": "apk" }
              }
            }
          }
          EOF

      - name: Reemplazar app.json
        run: |
          cat > app.json << 'EOF'
          {
            "expo": {
              "name": "ContainerApp",
              "slug": "containerapp",
              "version": "1.0.0",
              "orientation": "portrait",
              "icon": "./assets/icon.png",
              "splash": {
                "image": "./assets/splash.png",
                "resizeMode": "contain",
                "backgroundColor": "#0d1757"
              },
              "android": {
                "package": "com.rioestiba.containerapp",
                "adaptiveIcon": {
                  "foregroundImage": "./assets/adaptive-icon.png",
                  "backgroundColor": "#0d1757"
                }
              },
              "extra": {
                "eas": {
                  "projectId": "dd97ecff-a0b7-4199-9da0-9ffcb3ee1505"
                }
              }
            }
          }
          EOF

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        run: npm install

      - name: Build APK
        run: eas build --profile preview --platform android --non-interactive
